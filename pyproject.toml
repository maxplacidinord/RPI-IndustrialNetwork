[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpi-industrial-network"
version = "0.1.0"
description = "Read-only NORD drive telemetry gateway for a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "asyncua>=1.1,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]

[project.scripts]
drive-monitor = "drive_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drive_monitor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
